; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; native is test-only (see [env:native] below) -- it has no valid
; entry point under a plain `pio run`, only under `pio test -e
; native`. Excluding it here keeps the generic Build task (which
; builds default_envs) from always failing on it.
;
; display-test and full-io-test are standalone hardware diagnostics
; (see their comments below) -- excluded from default_envs so the
; generic Build/Upload actions don't touch them unless explicitly
; selected via `pio run -e display-test` / `-e full-io-test`.
[platformio]
default_envs = esp32-s3-devkitc-1, app, app-ota, app-rev2

; board = esp32-s3-n16r8 is a project-local board definition
; (boards/esp32-s3-n16r8.json) matching our actual hardware --
; Hosyond ESP32-S3-DevKitC-1-N16R8 (16MB flash, 8MB Octal PSRAM).
; PlatformIO's stock "esp32-s3-devkitc-1" board defaults to the N8
; variant (8MB flash, no PSRAM); its flash_size/partitions/PSRAM
; settings were previously patched here via board_build.*/build_flags
; overrides, which worked but left the board's own advertised
; maximum_size (8MB) stale/wrong. This custom board folds all of that
; into one accurate definition instead -- same pinout/variant (this
; is a standard DevKitC-1 form factor board, not a different one),
; just corrected capacity metadata.
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-n16r8
framework = arduino

monitor_speed = 115200

lib_deps =
    https://github.com/avishorp/TM1637.git
    madhephaestus/ESP32Encoder
    adafruit/Adafruit GFX Library
    adafruit/Adafruit ST7735 and ST7789 Library

; Standalone diagnostic: cycles 1/11/111/1111 on all four TM1637
; displays. Does not build or touch src/main.cpp. Rewritten for the
; REV2 board (own hardcoded pin constants in the .cpp, not
; HardwarePins.h) now that it's physically built -- see CLAUDE.md
; "REV2 hardware".
; Run with: pio run -e display-test -t upload
[env:display-test]
extends = env:esp32-s3-devkitc-1
build_src_filter = -<*> +<../examples/display_flash_test.cpp>

; Standalone diagnostic: TFT + WiFi captive-portal setup flow
; (WifiPortal) only -- no GameModeManager/ButtonInput/TimerManager/
; any other game/input class in the build. Isolates whether TFT +
; WiFi/HTTP-server alone reproduces the boot crash documented in
; CLAUDE.md's "Firmware status", decoupled from the rest of App.
; Does not touch src/main.cpp or any other environment.
; Run with: pio run -e wifi-menu-test -t upload
[env:wifi-menu-test]
extends = env:esp32-s3-devkitc-1
build_src_filter = -<*> +<../examples/wifi_menu_test.cpp> +<output/TftDisplayManager.cpp> +<storage/SettingsStorage.cpp> +<network/WifiPortal.cpp>

; Standalone diagnostic: TFT + a bare esp_http_server instance only --
; narrows wifi-menu-test's finding further (does the HTTP server alone,
; without WifiPortal's own code, trigger the crash?).
; Run with: pio run -e tft-httpd-test -t upload
[env:tft-httpd-test]
extends = env:esp32-s3-devkitc-1
build_src_filter = -<*> +<../examples/tft_httpd_test.cpp> +<output/TftDisplayManager.cpp>

; Standalone diagnostic: exhaustively tests internal SRAM and PSRAM
; for stuck-bit/addressing/data faults (several classic patterns:
; all-ones, all-zeros, alternating, walking-bit, address-as-data).
; Does not touch src/main.cpp or any other environment.
; Run with: pio run -e ram-test -t upload, then watch the serial
; monitor (115200 baud) for the PASS/FAIL report.
[env:ram-test]
extends = env:esp32-s3-devkitc-1
build_src_filter = -<*> +<../examples/ram_test.cpp>

; Full I/O diagnostic: exercises every wired input and output
; (4 player buttons + Action switch/light, 4 displays, TFT, encoder,
; buzzer). Does not build or touch src/main.cpp. Rewritten for the
; REV2 board now that it's physically built: buttons/lights go
; through the MCP23017 (own inline I2C register code in the .cpp, not
; the reusable io/ classes -- this diagnostic stays dependency-free by
; design) -- see CLAUDE.md "REV2 hardware".
; Run with: pio run -e full-io-test -t upload
[env:full-io-test]
extends = env:esp32-s3-devkitc-1
build_src_filter = -<*> +<../examples/full_io_test.cpp>

; Button input diagnostic: pressing any button (P1-4/Action) shows
; which one on the TFT (name + its MCP23017 GPA pin), lights that
; button's own LED, and flashes its assigned player display with its
; assigned number while held (P1-4 only). REV2 pins, MCP23017 via own
; inline I2C register code (same style as full-io-test -- dependency
; free by design). Does not build or touch src/main.cpp.
; Run with: pio run -e button-input-test -t upload
[env:button-input-test]
extends = env:esp32-s3-devkitc-1
build_src_filter = -<*> +<../examples/button_input_test.cpp>

; The real firmware: builds every module under src/ (App + all
; managers) plus the tiny entry point in examples/app_main.cpp,
; excluding only src/main.cpp (the hardware bring-up demo) and the
; REV2-only MCP23017 IO backends (see [env:app-rev2] below and
; CLAUDE.md "REV2 hardware") -- this targets REV1. REV1 still
; physically exists as a separate board, but REV2 is now the primary
; path forward -- see [env:app-rev2] below. Does not touch or replace
; main.cpp/the default env.
; Run with: pio run -e app -t upload
[env:app]
extends = env:esp32-s3-devkitc-1
build_src_filter = +<*> -<main.cpp> -<io/ButtonSwitchIo_Mcp23017.cpp> -<io/ButtonLightIo_Mcp23017.cpp> -<io/Mcp23017.cpp> +<../examples/app_main.cpp>

; Same firmware/entry point as [env:app], but built for the REV2 pin
; table (PINBALLTIMER_REV2, see HardwarePins.h) with the button
; switches/lights read through an MCP23017 over I2C instead of native
; GPIO -- see io/ButtonSwitchIo_Mcp23017.cpp / io/ButtonLightIo_Mcp23017.cpp
; and CLAUDE.md "REV2 hardware". REV2 is now the primary path forward:
; the physical board is built and connected, REV1 is kept as a
; secondary/reference board. This env hasn't been flashed to the real
; REV2 board yet -- so far only the standalone diagnostics
; (display-test, full-io-test) target it.
; Run with: pio run -e app-rev2 -t upload
[env:app-rev2]
extends = env:app
build_flags = ${env:app.build_flags} -D PINBALLTIMER_REV2
build_src_filter = +<*> -<main.cpp> -<io/ButtonSwitchIo_NativeGpio.cpp> -<io/ButtonLightIo_NativeGpio.cpp> +<../examples/app_main.cpp>

; Same real firmware as [env:app], but uploaded over WiFi (ArduinoOTA,
; see include/network/OtaManager.h) instead of USB -- for devices
; that are already enclosed. Requires the device to already be running
; firmware built from [env:app] or this env (OTA has to already be
; listening) and reachable at upload_port. Edit upload_port to this
; device's IP or its <deviceName>.local mDNS hostname (see
; SettingsStorage::deviceName()), and the --auth value below to match
; OTA_PASSWORD in include/Secrets.h (gitignored, not this file).
; Run with: pio run -e app-ota -t upload
[env:app-ota]
extends = env:app
upload_protocol = espota
upload_port = pinballtimer.local
upload_flags =
    --auth=pick-a-real-ota-password

; Native (host machine, no ESP32/hardware needed) unit tests for the
; pure-logic modules that have zero Arduino/hardware dependency:
; PlayerManager, ButtonAssignmentManager, DisplayAssignmentManager.
; TimerManager is NOT included here -- it calls millis() directly, and
; injecting a mockable clock into production code wasn't asked for.
; Run with: pio test -e native
[env:native]
platform = native
test_build_src = yes
build_src_filter = -<*> +<game/PlayerManager.cpp> +<game/ButtonAssignmentManager.cpp> +<game/DisplayAssignmentManager.cpp> +<game/TurnRotation.cpp> +<game/RoundRobinTurnEngine.cpp> +<game/MachineCatalog.cpp> +<modes/gauntlet/GauntletSession.cpp> +<modes/gauntlet/GauntletConfig.cpp> +<modes/gauntlet/GauntletConfigMenu.cpp> +<modes/round_robin/RoundRobinConfig.cpp> +<modes/round_robin/RoundRobinConfigMenu.cpp>
