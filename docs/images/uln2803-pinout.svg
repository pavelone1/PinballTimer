<svg viewBox="0 0 720 620" xmlns="http://www.w3.org/2000/svg" role="img">
<title>ULN2803A confirmed pinout for PinballTimer button lights</title>
<desc>Confirmed 18-pin DIP pinout for the ULN2803A Darlington sink array driving the 5 button lights. Active channels 1,3,4,5,7 carry the MCP23017's GPB0-4 (button lights P1-4/Action) and sink each LED's cathode to ground; channels 2,6,8 are unused and tied off. Pin 9 is device ground, pin 10 (COM) ties the internal flyback diodes to the +5V LED supply rail.</desc>
<style>
  text { font-family: sans-serif; }
  .mono { font-family: monospace; }
  .tprim { fill: #18181b; }
  .tsec { fill: #52525b; }
  .tmuted { fill: #a1a1aa; }
  .bg0 { fill: #f4f4f5; }
  .chipbody { fill: #e4e4e7; stroke: #a1a1aa; stroke-width: 1.5; }
  .pinline { stroke: #71717a; stroke-width: 1.5; }
  .c-active { fill: #3b82f6; }
  .c-spare { fill: #d4d4d8; }
  .c-pow { fill: #94a3b8; }
  @media (prefers-color-scheme: dark) {
    .bg0 { fill: #18181b; }
    .tprim { fill: #f4f4f5; }
    .tsec { fill: #a1a1aa; }
    .tmuted { fill: #71717a; }
    .chipbody { fill: #3f3f46; stroke: #71717a; }
    .pinline { stroke: #a1a1aa; }
    .c-spare { fill: #52525b; }
  }
</style>

<rect x="0" y="0" width="720" height="620" class="bg0"/>

<text x="360" y="34" text-anchor="middle" font-size="20" font-weight="600" class="tprim">ULN2803A Pinout (CONFIRMED)</text>
<text x="360" y="54" text-anchor="middle" font-size="12" class="tsec">Button-light driver: MCP23017 GPB0-4 in, 5V-rail LED cathodes out. Active channels 1,3,4,5,7 -- 2,6,8 unused.</text>

<!-- Chip body -->
<rect x="280" y="110" width="160" height="380" rx="4" class="chipbody"/>
<!-- Pin-1 orientation notch -->
<path d="M 335 110 A 25 14 0 0 0 385 110 Z" class="chipbody"/>
<text x="360" y="300" text-anchor="middle" font-size="13" font-weight="600" class="tsec" transform="rotate(90 360 300)">ULN2803A</text>

<!-- Left pins 1-9 (IN1-8, GND) -->
<!-- pin 1 -->
<line x1="200" y1="140" x2="280" y2="140" class="pinline"/>
<circle cx="200" cy="140" r="3" class="c-active"/>
<text x="190" y="136" text-anchor="end" font-size="10" class="tmuted">1</text>
<text x="205" y="132" font-size="11" class="mono tprim">IN1</text>
<text x="205" y="150" font-size="10" class="tsec">MCP23017 GPB4 (P1 light)</text>

<!-- pin 2 -->
<line x1="200" y1="180" x2="280" y2="180" class="pinline"/>
<circle cx="200" cy="180" r="3" class="c-spare"/>
<text x="190" y="176" text-anchor="end" font-size="10" class="tmuted">2</text>
<text x="205" y="172" font-size="11" class="mono tmuted">IN2</text>
<text x="205" y="190" font-size="10" font-style="italic" class="tmuted">unused -- tie to GND</text>

<!-- pin 3 -->
<line x1="200" y1="220" x2="280" y2="220" class="pinline"/>
<circle cx="200" cy="220" r="3" class="c-active"/>
<text x="190" y="216" text-anchor="end" font-size="10" class="tmuted">3</text>
<text x="205" y="212" font-size="11" class="mono tprim">IN3</text>
<text x="205" y="230" font-size="10" class="tsec">MCP23017 GPB0 (P4 light)</text>

<!-- pin 4 -->
<line x1="200" y1="260" x2="280" y2="260" class="pinline"/>
<circle cx="200" cy="260" r="3" class="c-active"/>
<text x="190" y="256" text-anchor="end" font-size="10" class="tmuted">4</text>
<text x="205" y="252" font-size="11" class="mono tprim">IN4</text>
<text x="205" y="270" font-size="10" class="tsec">MCP23017 GPB1 (P2 light)</text>

<!-- pin 5 -->
<line x1="200" y1="300" x2="280" y2="300" class="pinline"/>
<circle cx="200" cy="300" r="3" class="c-active"/>
<text x="190" y="296" text-anchor="end" font-size="10" class="tmuted">5</text>
<text x="205" y="292" font-size="11" class="mono tprim">IN5</text>
<text x="205" y="310" font-size="10" class="tsec">MCP23017 GPB2 (Action light)</text>

<!-- pin 6 -->
<line x1="200" y1="340" x2="280" y2="340" class="pinline"/>
<circle cx="200" cy="340" r="3" class="c-spare"/>
<text x="190" y="336" text-anchor="end" font-size="10" class="tmuted">6</text>
<text x="205" y="332" font-size="11" class="mono tmuted">IN6</text>
<text x="205" y="350" font-size="10" font-style="italic" class="tmuted">unused -- tie to GND</text>

<!-- pin 7 -->
<line x1="200" y1="380" x2="280" y2="380" class="pinline"/>
<circle cx="200" cy="380" r="3" class="c-active"/>
<text x="190" y="376" text-anchor="end" font-size="10" class="tmuted">7</text>
<text x="205" y="372" font-size="11" class="mono tprim">IN7</text>
<text x="205" y="390" font-size="10" class="tsec">MCP23017 GPB3 (P3 light)</text>

<!-- pin 8 -->
<line x1="200" y1="420" x2="280" y2="420" class="pinline"/>
<circle cx="200" cy="420" r="3" class="c-spare"/>
<text x="190" y="416" text-anchor="end" font-size="10" class="tmuted">8</text>
<text x="205" y="412" font-size="11" class="mono tmuted">IN8</text>
<text x="205" y="430" font-size="10" font-style="italic" class="tmuted">unused -- tie to GND</text>

<!-- pin 9 -->
<line x1="200" y1="460" x2="280" y2="460" class="pinline"/>
<circle cx="200" cy="460" r="3" class="c-pow"/>
<text x="190" y="456" text-anchor="end" font-size="10" class="tmuted">9</text>
<text x="205" y="452" font-size="11" class="mono tprim">GND</text>
<text x="205" y="470" font-size="10" class="tsec">System ground</text>

<!-- Right pins 10-18 (COM, OUT8-1) -->
<!-- pin 10 -->
<line x1="440" y1="460" x2="520" y2="460" class="pinline"/>
<circle cx="520" cy="460" r="3" class="c-pow"/>
<text x="530" y="456" font-size="10" class="tmuted">10</text>
<text x="515" y="452" text-anchor="end" font-size="11" class="mono tprim">COM</text>
<text x="515" y="470" text-anchor="end" font-size="10" class="tsec">+5V LED rail (flyback diode common)</text>

<!-- pin 11 -->
<line x1="440" y1="420" x2="520" y2="420" class="pinline"/>
<circle cx="520" cy="420" r="3" class="c-spare"/>
<text x="530" y="416" font-size="10" class="tmuted">11</text>
<text x="515" y="412" text-anchor="end" font-size="11" class="mono tmuted">OUT8</text>
<text x="515" y="430" text-anchor="end" font-size="10" font-style="italic" class="tmuted">unused -- no connection</text>

<!-- pin 12 -->
<line x1="440" y1="380" x2="520" y2="380" class="pinline"/>
<circle cx="520" cy="380" r="3" class="c-active"/>
<text x="530" y="376" font-size="10" class="tmuted">12</text>
<text x="515" y="372" text-anchor="end" font-size="11" class="mono tprim">OUT7</text>
<text x="515" y="390" text-anchor="end" font-size="10" class="tsec">P3 LED cathode</text>

<!-- pin 13 -->
<line x1="440" y1="340" x2="520" y2="340" class="pinline"/>
<circle cx="520" cy="340" r="3" class="c-spare"/>
<text x="530" y="336" font-size="10" class="tmuted">13</text>
<text x="515" y="332" text-anchor="end" font-size="11" class="mono tmuted">OUT6</text>
<text x="515" y="350" text-anchor="end" font-size="10" font-style="italic" class="tmuted">unused -- no connection</text>

<!-- pin 14 -->
<line x1="440" y1="300" x2="520" y2="300" class="pinline"/>
<circle cx="520" cy="300" r="3" class="c-active"/>
<text x="530" y="296" font-size="10" class="tmuted">14</text>
<text x="515" y="292" text-anchor="end" font-size="11" class="mono tprim">OUT5</text>
<text x="515" y="310" text-anchor="end" font-size="10" class="tsec">Action LED cathode</text>

<!-- pin 15 -->
<line x1="440" y1="260" x2="520" y2="260" class="pinline"/>
<circle cx="520" cy="260" r="3" class="c-active"/>
<text x="530" y="256" font-size="10" class="tmuted">15</text>
<text x="515" y="252" text-anchor="end" font-size="11" class="mono tprim">OUT4</text>
<text x="515" y="270" text-anchor="end" font-size="10" class="tsec">P2 LED cathode</text>

<!-- pin 16 -->
<line x1="440" y1="220" x2="520" y2="220" class="pinline"/>
<circle cx="520" cy="220" r="3" class="c-active"/>
<text x="530" y="216" font-size="10" class="tmuted">16</text>
<text x="515" y="212" text-anchor="end" font-size="11" class="mono tprim">OUT3</text>
<text x="515" y="230" text-anchor="end" font-size="10" class="tsec">P4 LED cathode</text>

<!-- pin 17 -->
<line x1="440" y1="180" x2="520" y2="180" class="pinline"/>
<circle cx="520" cy="180" r="3" class="c-spare"/>
<text x="530" y="176" font-size="10" class="tmuted">17</text>
<text x="515" y="172" text-anchor="end" font-size="11" class="mono tmuted">OUT2</text>
<text x="515" y="190" text-anchor="end" font-size="10" font-style="italic" class="tmuted">unused -- no connection</text>

<!-- pin 18 -->
<line x1="440" y1="140" x2="520" y2="140" class="pinline"/>
<circle cx="520" cy="140" r="3" class="c-active"/>
<text x="530" y="136" font-size="10" class="tmuted">18</text>
<text x="515" y="132" text-anchor="end" font-size="11" class="mono tprim">OUT1</text>
<text x="515" y="150" text-anchor="end" font-size="10" class="tsec">P1 LED cathode</text>

<!-- Legend -->
<g transform="translate(40,530)">
  <text x="0" y="-8" font-size="11" font-weight="600" class="tsec">Legend</text>
  <g transform="translate(0,0)"><rect width="10" height="10" class="c-active"/><text x="16" y="9" font-size="10" class="tsec">Active channel (P1-4/Action)</text></g>
  <g transform="translate(220,0)"><rect width="10" height="10" class="c-spare"/><text x="16" y="9" font-size="10" class="tsec">Unused/spare</text></g>
  <g transform="translate(400,0)"><rect width="10" height="10" class="c-pow"/><text x="16" y="9" font-size="10" class="tsec">Power / ground</text></g>
</g>

<text x="40" y="565" font-size="9" class="tmuted">LED anodes tie to +5V, each ULN2803A output sinks its cathode to ground when its MCP23017 GPB input is driven high (active-high channel enable).</text>
<text x="40" y="580" font-size="9" class="tmuted">Unused channels (2, 6, 8) tied to GND to avoid floating/noise-induced partial turn-on; their outputs are simply left unconnected.</text>

</svg>
